[package]
name = "halo"
version = "0.2.0"
edition = "2021"

[lib]
name = "halo"
path = "src/lib.rs"

[[bin]]
name = "halo"
path = "src/main.rs"

[dependencies]
inkwell = { git = "https://github.com/TheDan64/inkwell", features = ["llvm23-1"] }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
