# The Halo Programming Language
# CI — runs on every push to main/master and on every pull request.
#
# Halo is interpreter-only and has no external dependencies, so CI needs
# nothing beyond a stock Rust toolchain: no native compiler or system libs.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel any in-progress run for the same branch / PR so we don't waste minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Minimal permissions — CI only needs to read the repo.
permissions:
  contents: read

jobs:
  # ── Format ───────────────────────────────────────────────────────────────────
  fmt:
    name: Format (cargo fmt)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ── Lint ─────────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Test (cargo test)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked
